[package]
name = "charter"
version = "0.1.0"
edition = "2024"
description = "Beatmap editor for SIF2 custom-songs servers"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
lzma-rs = "0.3"

[profile.dev]
# symphonia is unusably slow at opt-level 0 for long tracks
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
